# Rollback (hoặc triển khai lại) bằng tay: đưa một image ĐÃ CÓ trong registry trở lại app và hai job trên Azure.
# Không chạy test và không build: khi bản mới nhất bị lỗi thì vẫn quay lại được ngay.
# Cách dùng: GitHub > Actions > rollback > Run workflow > nhập SHA đầy đủ của commit cần quay về (nhánh main).
# Cùng identity OIDC và cùng script với bước deploy của workflow `ci` (deploy/azure/deploy.sh).
name: rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA of the image to put back (must already be in the registry)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ secrets.AZURE_REGISTRY }}
      # Giá trị nhập tay chỉ đi qua biến môi trường, không chèn thẳng vào lệnh shell.
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Put the chosen image back and wait until it is healthy
        run: bash deploy/azure/deploy.sh "$IMAGE_TAG"
